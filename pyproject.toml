[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-project"
version = "0.1.0"
description = "Sample project (model-view) to manage companies and employees with SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sample-project = "src.main:main"

[tool.setuptools]
packages = ["src", "src.employees", "src.util"]

[tool.pytest.ini_options]
python_files = "test*.py"